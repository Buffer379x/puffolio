          },
          "fieldId": {
            "type": "string",
            "format": "uuid"
          },
          "limit": {
            "enum": [
              3,
              5,
              10
            ]
          },
          "threshold": {
            "type": "string"
          },
          "inclusive": {
            "type": "boolean"
          },
          "from": {
            "type": "string",
            "format": "date"
          },
          "to": {
            "type": "string",
            "format": "date"
          },
