          "fields": {
            "type": "integer"
          },
          "media": {
            "type": "integer"
          }
        },
        "required": [
          "liquids",
          "fields",
          "media"
        ]
      },
      "Success": {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean"
          }
        },
        "required": [
          "success"
        ]
      },
      "Version": {
        "type": "object",
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          }
        },
        "required": [
          "version"
        ]
      }
    }
