            "type": "string"
          },
          "count": {
            "type": "integer"
          },
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Liquid"
            }
          },
          "tags": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string",
                  "format": "uuid"
                },
                "name": {
                  "type": "string"
                },
                "paletteId": {
                  "$ref": "#/components/schemas/Palette"
                },
                "count": {
                  "type": "integer"
                }
              },
              "required": [
                "id",
                "name",
                "paletteId",
                "count"
              ]
            }
          },
          "error": {
            "type": "string"
          }
        },
        "required": [
          "id"
        ]
      },
      "SavedView": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "search": {
            "type": "string"
          },
          "filters": {
            "$ref": "#/components/schemas/Filter"
          },
          "sort": {
            "type": "string"
          },
          "direction": {
            "enum": [
              "asc",
              "desc"
            ]
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "favorite": {
            "type": "boolean",
            "default": false
          }
        },
        "required": [
          "id",
          "name",
          "search",
          "sort",
          "direction",
          "version"
        ]
      },
      "Counts": {
        "type": "object",
        "properties": {
