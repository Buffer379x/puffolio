{
  "openapi": "3.1.0",
  "info": {
    "title": "Puffolio API",
    "version": "0.3.0",
    "description": "Same-origin. One administrator maintains the collection; read routes marked with an empty security requirement are public. Trash and media variant=master always require the session. UTC event timestamps; calendar dates YYYY-MM-DD; numbers are exact canonical decimal strings. Cookie sessions:7-day idle/30-day absolute. Mutation CSRF+Origin required. New required fields apply only to newly created liquids via requiredFrom cutoff. Field PATCH merges top-level properties; liquid PATCH merges submitted value keys, null removes. Import defaults preserve archived historical options."
  },
