                    "const": true
                  }
                },
                "required": [
                  "token",
                  "confirm"
                ]
              }
            }
          }
        },
        "description": "Repeats destination compatibility and combined limits within the import transaction. An unsafe destination change after preview returns422 with no collection mutation."
