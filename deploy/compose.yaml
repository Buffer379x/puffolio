services:
  puffolio:
    image: ghcr.io/buffer379x/puffolio:0.4.0
    container_name: puffolio
    user: "99:100"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PUFFOLIO_PORT:-8787}:8080"
    environment:
      PUFFOLIO_DATA_DIR: /data
      PUFFOLIO_HTTP_ADDR: ":8080"
      # Leer: Puffolio akzeptiert die aufgerufene Adresse. Nur zum Festlegen setzen.
      PUFFOLIO_BASE_URL: ${PUFFOLIO_BASE_URL:-}
      PUFFOLIO_COOKIE_SECURE: ${PUFFOLIO_COOKIE_SECURE:-false}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      # Vorher lokal erstellen und UID 99 / GID 100 Schreibrechte geben.
      # Auf Unraid z. B. /mnt/user/appdata/puffolio:/data
      - ./data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    healthcheck:
      test: ["CMD", "/puffolio", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 20s
