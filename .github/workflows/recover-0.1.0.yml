name: Recover published 0.1.0 verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: puffolio-release-0.1.0
  cancel-in-progress: false
env:
  ORIGINAL_SHA: 2c7d5e043aaf15e2f738b2fbb442fada003a635f
  IMAGE: ghcr.io/buffer379x/puffolio
  INDEX_DIGEST: sha256:e4f9d8a2ab11e5e853670da5a0b7609474ef6428ffe9549e440e3d37f37f722d
  PYTHONPYCACHEPREFIX: ${{ github.workspace }}/work/cache/python
jobs:
  validate-existing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ORIGINAL_SHA }}
          path: original
          persist-credentials: false
      - name: Bind reviewed main control and fixed original product source
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C original rev-parse HEAD)" = "$ORIGINAL_SHA"
          test "$(cat original/VERSION)" = 0.1.0
          config="$RUNNER_TEMP/puffolio-recovery-identity"
          install -d -m 700 "$config"
          printf '{}\n' > "$config/config.json"
          printf 'DOCKER_CONFIG=%s\n' "$config" >> "$GITHUB_ENV"
      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/docs/scripts/recovery-release.py check-absent
      - name: Validate original published identity and exact native platform digests
        run: |
          python3 original/docs/scripts/release-image.py --image "$IMAGE" \
            --source-sha "$ORIGINAL_SHA" --expected-digest "$INDEX_DIGEST" --output work/identity/index.json
          python3 control/docs/scripts/recovery-release.py identity work/identity/index.json
      - name: Read-only registry authentication for provenance verification
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify existing original signed provenance without signing again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "oci://$IMAGE@$INDEX_DIGEST" \
            --repo Buffer379x/puffolio \
            --signer-workflow Buffer379x/puffolio/.github/workflows/release.yml \
            --source-digest "$ORIGINAL_SHA" --source-ref refs/heads/main \
            --deny-self-hosted-runners --format json > work/identity/attestation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-identity
          path: work/identity/
          overwrite: true
          if-no-files-found: error
          retention-days: 14
  native-verification:
    needs: validate-existing
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform_digest: sha256:7cead596f8990604fcbda2afb59550d2cd80ebefc46320759cf48a888a9a47f4
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform_digest: sha256:305c7f351d74c3947a8d31aaba8741f3207456b92210a0f495817ba93fa3119b
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ARCH: ${{ matrix.arch }}
      EXPECTED_PLATFORM_DIGEST: ${{ matrix.platform_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ORIGINAL_SHA }}
          path: original
          persist-credentials: false
      - name: Initialize fresh anonymous configuration and verify both checkouts
        run: |
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C original rev-parse HEAD)" = "$ORIGINAL_SHA"
          config="$RUNNER_TEMP/puffolio-recovery-anonymous-$ARCH"
          install -d -m 700 "$config"
          printf '{}\n' > "$config/config.json"
          printf 'DOCKER_CONFIG=%s\n' "$config" >> "$GITHUB_ENV"
      - name: Anonymous native pull and exact platform binding
        id: platform
        run: |
          mkdir -p work/release-assets
          docker pull --platform "linux/$ARCH" "$IMAGE@$INDEX_DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:0.1.0" --format '{{.Manifest.Digest}}')" = "$INDEX_DIGEST"
          docker buildx imagetools inspect "$IMAGE@$INDEX_DIGEST" --raw > work/index.json
          digest=$(python3 control/docs/scripts/recovery-release.py platform work/index.json "$ARCH")
          test "$digest" = "$EXPECTED_PLATFORM_DIGEST"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Original full native lifecycle, image load, restart and offline restore
        working-directory: original
        run: bash docs/scripts/container-smoke.sh "$IMAGE@$INDEX_DIGEST" "linux/$ARCH"
      - name: Platform SPDX inventory
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/buffer379x/puffolio@${{ steps.platform.outputs.digest }}
          syft-version: v1.56.0
          output-file: work/release-assets/puffolio-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Full fresh pinned remote vulnerability scan
        run: bash control/docs/scripts/scan-image.sh "$IMAGE@$EXPECTED_PLATFORM_DIGEST" "work/release-assets/scan-$ARCH.json" "linux/$ARCH"
      - name: Enforce original runtime vulnerability policy and bind successful evidence
        run: |
          python3 original/docs/scripts/scan-policy.py "work/release-assets/scan-$ARCH.json"
          python3 control/docs/scripts/recovery-release.py receipt work/release-assets "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: recovered-${{ matrix.arch }}
          path: |
            work/release-assets/puffolio-${{ matrix.arch }}.spdx.json
            work/release-assets/scan-${{ matrix.arch }}.json
            work/release-assets/scan-${{ matrix.arch }}.json.scanner.json
            work/release-assets/verification-${{ matrix.arch }}.json
          overwrite: true
          if-no-files-found: error
          retention-days: 14
  github-release:
    needs: [validate-existing, native-verification]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ORIGINAL_SHA }}
          path: original
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovery-identity
          path: work/identity
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovered-amd64
          path: work/evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: recovered-arm64
          path: work/evidence
      - name: Recheck immutable alias and original source before assembling exact assets
        run: |
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C original rev-parse HEAD)" = "$ORIGINAL_SHA"
          config="$RUNNER_TEMP/puffolio-recovery-final-anonymous"
          install -d -m 700 "$config"
          printf '{}\n' > "$config/config.json"
          export DOCKER_CONFIG="$config"
          python3 original/docs/scripts/release-image.py --image "$IMAGE" \
            --source-sha "$ORIGINAL_SHA" --expected-digest "$INDEX_DIGEST" --output work/final-index.json
          python3 control/docs/scripts/recovery-release.py identity work/final-index.json
          python3 control/docs/scripts/recovery-release.py assemble original work/evidence work/identity work/release-assets
      - name: Atomically create original-source tag and publish only after every gate
        run: |
          python3 control/docs/scripts/recovery-release.py check-absent
          gh api --method POST repos/Buffer379x/puffolio/git/refs \
            -f ref=refs/tags/v0.1.0 -f sha="$ORIGINAL_SHA" > work/created-tag.json
          python3 control/docs/scripts/recovery-release.py check-tag
          gh release create v0.1.0 work/release-assets/* \
            --repo Buffer379x/puffolio --verify-tag --title 'Puffolio 0.1.0' \
            --notes-file original/docs/release-0.1.0.md --latest=false
          python3 control/docs/scripts/recovery-release.py check-tag
