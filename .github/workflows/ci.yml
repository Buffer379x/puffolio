name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/work/cache/npm
      XDG_CACHE_HOME: ${{ github.workspace }}/work/cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/work/cache/ms-playwright
      GOMODCACHE: ${{ github.workspace }}/work/cache/go-mod
      NODE_PATH: ${{ github.workspace }}/web/node_modules
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/work/cache/python
      GOCACHE: ${{ github.workspace }}/work/cache/go-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: Install exact frontend dependencies
        run: |
          npm install --global pnpm@12.16.1
          pnpm --dir web install --frozen-lockfile
      - name: Frontend behavior, types and production build
        run: |
          pnpm --dir web typecheck
          pnpm --dir web test
          pnpm --dir web build
          pnpm --dir web audit --audit-level=moderate
      - name: Backend behavior and static checks
        run: |
          go test ./... -count=1
          go vet ./...
          mkdir -p work/bin
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -X main.version=0.1.0' -o work/bin/puffolio ./cmd/puffolio
      - name: Browser tests
        run: |
          pnpm --dir web exec playwright install --with-deps chromium firefox webkit
          pnpm --dir web test:e2e
      - name: Check published file boundary
        run: |
          python3 -m unittest discover -s docs/scripts -p 'test_*.py'
          python3 docs/scripts/check-artifacts.py
      - name: Validate deployment files
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          python3 -c 'import xml.etree.ElementTree as E; E.parse("deploy/unraid/puffolio.xml")'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build runtime image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: puffolio:ci
          platforms: linux/amd64
          build-args: VERSION=0.1.0
      - name: Container lifecycle, isolation and backup restore
        run: bash docs/scripts/container-smoke.sh puffolio:ci linux/amd64
      - name: Test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics
          path: work/qa/playwright/
          if-no-files-found: ignore
          retention-days: 7
